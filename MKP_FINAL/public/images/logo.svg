<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Rim luar koin -->
  <circle cx="64" cy="64" r="60" fill="url(#coinRim)"/>
  <!-- Permukaan koin -->
  <circle cx="64" cy="64" r="50" fill="url(#coinFace)"/>
  <!-- Cincin dekoratif dalam -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5"/>
  <!-- Kilau -->
  <path d="M 34 40 A 46 46 0 0 1 60 20" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>

  <!-- Simbol dolar -->
  <text x="64" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold"
        text-anchor="middle" fill="#ffffff" fill-opacity="0.95">$</text>
</svg>
